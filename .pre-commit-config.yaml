repos:
  # ── Python linting + formatting ──────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Notebook hygiene ─────────────────────────────────────────────────
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # ── File validation + safety (Context Forge pattern) ─────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-ast
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: name-tests-test
        args: ['--pytest-test-first']

  # ── Secret detection ─────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # ── AI content detection (Context Forge pattern) ─────────────────────
  - repo: local
    hooks:
      - id: forbid-ai-stock-phrases
        name: Block AI stock phrases in docs
        language: system
        entry: bash -c 'grep -rnE "(As an AI|I am an AI|delve into|it'\''s worth noting that)" --include="*.md" "$@" && exit 1 || exit 0' --
        pass_filenames: false
        types: [text]
