[project]
name = "data-arch-ai-era-lecture"
version = "0.1.0"
description = "Data Architecture for the AI Era — hands-on lecture materials"
requires-python = ">=3.11"
dependencies = [
    # Data generation
    "pandas",
    "pyarrow",
    "faker",
    # Query engines
    "duckdb",
    "psycopg2-binary",
    "trino",
    "sqlalchemy",
    # Lakehouse
    "pyiceberg",
    # Object storage
    "minio",
    # Search
    "opensearch-py",
    # Deck and document generation
    "python-pptx",
    "Pillow",
    "reportlab",
    # Notebooks
    "jupyter",
    "ipykernel",
    "nbconvert",
    # Document parsing
    "docling",
    # Embeddings
    "sentence-transformers",
    # HTTP
    "requests",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "nbstripout",
    "detect-secrets",
]
watsonx = [
    "ibm-watsonx-ai",
    "ibm-cos-sdk",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "integration: requires Docker services",
]
