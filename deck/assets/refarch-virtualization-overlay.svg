  <text x="790" y="116" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#002B80">Data Virtualization</text>
  <rect x="740" y="130" width="100" height="24" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="0.5"/>
  <text x="790" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#002B80">Presto / watsonx.data</text>
  <rect x="740" y="160" width="100" height="24" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="0.5"/>
  <text x="790" y="176" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#002B80">Db2 Big SQL</text>
