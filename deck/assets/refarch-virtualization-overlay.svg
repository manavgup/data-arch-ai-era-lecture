<svg width="100%" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg">
  <title>Reference Architecture — Data Virtualization Pattern Overlay</title>

  <rect width="1400" height="760" fill="#F4F2EC"/>

  <!-- Title -->
  <text x="700" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#15171A">Reference Architecture — Data Virtualization Pattern</text>
  <text x="700" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5C6470">Federated queries, no data movement · Components highlighted in blue</text>

  <!-- ═══ COLUMN 1: Data Sources — PARTIALLY ACTIVE ═══ -->
  <rect x="15" y="55" width="150" height="480" rx="6" fill="#1E88E5" stroke="#42A5F5" stroke-width="0.5"/>
  <text x="90" y="78" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="white">Data Sources</text>

  <!-- Dimmed: unstructured sources virt typically can't query -->
  <rect x="25" y="92" width="130" height="30" rx="4" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.5" opacity="0.5"/>
  <text x="90" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#9E9E9E">Machine &amp; Sensor</text>
  <rect x="25" y="126" width="130" height="30" rx="4" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.5" opacity="0.5"/>
  <text x="90" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#9E9E9E">Image &amp; Video</text>
  <rect x="25" y="160" width="130" height="30" rx="4" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.5" opacity="0.5"/>
  <text x="90" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#9E9E9E">Content Services</text>
  <rect x="25" y="194" width="130" height="30" rx="4" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.5" opacity="0.5"/>
  <text x="90" y="214" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#9E9E9E">Social Data</text>
  <!-- Active: structured sources virtualization can query -->
  <rect x="25" y="228" width="130" height="30" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="1"/>
  <text x="90" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#002B80">Relational DBs</text>
  <rect x="25" y="262" width="130" height="30" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="1"/>
  <text x="90" y="282" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#002B80">Data Warehouses</text>
  <rect x="25" y="296" width="130" height="30" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="1"/>
  <text x="90" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#002B80">Cloud Data Stores</text>
  <rect x="25" y="330" width="130" height="30" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="1"/>
  <text x="90" y="350" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#002B80">Transactional Data</text>
  <rect x="25" y="364" width="130" height="30" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="1"/>
  <text x="90" y="384" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#002B80">Application Data</text>
  <rect x="25" y="398" width="130" height="30" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="1"/>
  <text x="90" y="418" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#002B80">System of Record</text>

  <!-- Vertical label -->
  <rect x="168" y="55" width="22" height="480" rx="3" fill="#E3F2FD" stroke="#90CAF9" stroke-width="0.5"/>
  <text x="179" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#1565C0" transform="rotate(-90,179,320)">Data acquisition &amp; application access</text>

  <!-- ═══ COLUMN 2: Ingestion — DIMMED (no data movement!) ═══ -->
  <rect x="200" y="55" width="130" height="430" rx="6" fill="#B0BEC5" stroke="#CFD8DC" stroke-width="0.5" opacity="0.4"/>
  <text x="265" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="white" opacity="0.4">Ingestion &amp;</text>
  <text x="265" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="white" opacity="0.4">Integration</text>
  <text x="265" y="260" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-style="italic" fill="#78909C">No data movement</text>
  <text x="265" y="276" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-style="italic" fill="#78909C">Queries go</text>
  <text x="265" y="292" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-style="italic" fill="#78909C">to sources</text>

  <!-- ═══ COLUMN 3: Storage — PARTIALLY ACTIVE (existing stores queried in place) ═══ -->
  <rect x="340" y="55" width="380" height="430" rx="6" fill="#1565C0" stroke="#42A5F5" stroke-width="0.5" opacity="0.7"/>
  <text x="530" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">Analytical Data Management &amp; Storage</text>

  <!-- Multiple existing stores sub-boxes -->
  <rect x="355" y="95" width="165" height="120" rx="4" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <text x="437" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.9)">Db2 Warehouse</text>
  <rect x="375" y="125" width="125" height="24" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="0.5"/>
  <text x="437" y="141" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#002B80">SMP / MPP</text>
  <rect x="375" y="155" width="125" height="24" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="0.5"/>
  <text x="437" y="171" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#002B80">Star schemas</text>

  <rect x="530" y="95" width="175" height="120" rx="4" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <text x="617" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.9)">Object Lake</text>
  <rect x="545" y="125" width="145" height="24" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="0.5"/>
  <text x="617" y="141" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#002B80">S3 / COS</text>
  <rect x="545" y="155" width="145" height="24" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="0.5"/>
  <text x="617" y="171" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#002B80">Parquet, Iceberg</text>

  <rect x="355" y="225" width="350" height="80" rx="4" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <text x="530" y="245" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.9)">Operational Postgres</text>
  <rect x="420" y="258" width="220" height="24" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="0.5"/>
  <text x="530" y="274" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#002B80">OLTP tables, operational data</text>

  <!-- Note -->
  <text x="530" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-style="italic" fill="rgba(255,255,255,0.6)">Data stays in place</text>
  <text x="530" y="388" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-style="italic" fill="rgba(255,255,255,0.6)">Virt layer queries across all stores</text>

