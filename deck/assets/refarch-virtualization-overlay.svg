  <rect x="740" y="220" width="100" height="24" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="0.5"/>
  <text x="790" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#002B80">JDBC connectors</text>

  <!-- ═══ Discovery — DIMMED ═══ -->
