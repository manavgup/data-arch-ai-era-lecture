  <text x="1292" y="277" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#15171A">Real-time views</text>

  <!-- ═══ Analytics In-Motion — DIMMED ═══ -->
  <rect x="200" y="492" width="650" height="43" rx="4" fill="#B0BEC5" stroke="#CFD8DC" stroke-width="0.5" opacity="0.4"/>
  <text x="525" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" opacity="0.4">Analytics In-Motion</text>

