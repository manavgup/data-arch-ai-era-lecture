  <rect x="1200" y="130" width="185" height="355" rx="6" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="1292" y="156" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#15171A">Enhanced</text>
  <text x="1292" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#15171A">Applications</text>
  <rect x="1212" y="190" width="160" height="28" rx="4" fill="#FFECB3" stroke="#FFD54F" stroke-width="0.5"/>
