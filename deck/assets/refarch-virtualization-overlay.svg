  <rect x="910" y="230" width="230" height="24" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="0.5"/>
  <text x="1025" y="246" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#002B80">watsonx.ai</text>
  <rect x="910" y="260" width="230" height="24" rx="4" fill="#D0E2FF" stroke="#8DB4F0" stroke-width="0.5"/>
  <text x="1025" y="276" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#002B80">Ad-hoc SQL</text>

