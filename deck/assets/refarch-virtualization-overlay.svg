  <rect x="860" y="130" width="330" height="355" rx="6" fill="#1E88E5" stroke="#42A5F5" stroke-width="0.5"/>
  <text x="1025" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">Actionable Insight</text>
