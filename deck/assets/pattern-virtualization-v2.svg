<svg width="100%" viewBox="0 0 280 960" xmlns="http://www.w3.org/2000/svg">
  <title>Data Virtualization architecture pattern</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer column (dark cyan for virtualization) -->
  <rect x="10" y="20" width="260" height="920" rx="12" fill="rgb(0,77,115)" stroke="rgb(100,181,220)" stroke-width="0.5"/>
  <text x="140" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="rgb(250,249,245)">Data Virtualization</text>
  <text x="140" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(194,192,182)">Federated queries, no data movement</text>

  <!-- Layer 1: Consumption -->
  <rect x="25" y="90" width="230" height="125" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Consumption</text>
  <rect x="98" y="120" width="84" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Cognos BI</text>
  <rect x="90" y="144" width="100" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Watson Studio</text>
  <rect x="94" y="168" width="92" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="182" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">watsonx.ai</text>
  <rect x="92" y="192" width="96" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Ad-hoc SQL</text>
  <line x1="140" y1="215" x2="140" y2="240" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: Federation engine -->
  <rect x="25" y="240" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="260" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Federation engine</text>
  <rect x="48" y="270" width="184" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="284" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Presto / watsonx.data SQL</text>
  <rect x="87" y="294" width="106" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="308" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Db2 Big SQL</text>
  <rect x="60" y="318" width="160" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Cost-based optimizer</text>
  <line x1="140" y1="345" x2="140" y2="370" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: Connectors -->
  <rect x="25" y="370" width="230" height="150" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="390" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Connectors</text>
  <rect x="112" y="400" width="56" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="414" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">JDBC</text>
  <rect x="104" y="424" width="72" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="438" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Iceberg</text>
  <rect x="108" y="448" width="64" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="462" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Kafka</text>
  <rect x="98" y="472" width="84" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="486" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">MongoDB</text>
  <rect x="72" y="496" width="136" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="510" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">S3, Materialized views</text>
  <line x1="140" y1="520" x2="140" y2="545" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: Sources (in place) -->
  <rect x="25" y="545" width="230" height="125" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="565" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Sources (in place)</text>
  <rect x="83" y="575" width="114" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="589" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Db2 Warehouse</text>
  <rect x="72" y="599" width="136" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="613" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Object lake (S3)</text>
  <rect x="60" y="623" width="160" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="637" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Operational Postgres</text>
  <rect x="72" y="647" width="136" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="661" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Third-party APIs</text>
  <line x1="140" y1="670" x2="140" y2="695" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 5: Governance -->
  <rect x="25" y="695" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="715" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Governance</text>
  <rect x="68" y="725" width="144" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="739" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Row/column policies</text>
  <rect x="92" y="749" width="96" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="763" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Query audit</text>
  <rect x="68" y="773" width="144" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="787" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Knowledge Catalog</text>
</svg>
