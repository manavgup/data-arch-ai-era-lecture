<svg width="100%" viewBox="0 0 280 1060" xmlns="http://www.w3.org/2000/svg">
  <title>Data Mesh architecture pattern</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer column (signal blue for mesh) -->
  <rect x="10" y="20" width="260" height="1020" rx="12" fill="rgb(45,74,222)" stroke="rgb(140,160,240)" stroke-width="0.5"/>
  <text x="140" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="rgb(250,249,245)">Data Mesh</text>
  <text x="140" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(194,192,182)">Domain-owned data products</text>

  <!-- Layer 1: Cross-domain consumers -->
  <rect x="25" y="90" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Cross-domain consumers</text>
  <rect x="85" y="120" width="110" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Customer 360</text>
  <rect x="79" y="144" width="122" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Fraud modelling</text>
  <rect x="63" y="168" width="154" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="182" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Regulatory reporting</text>
  <line x1="140" y1="195" x2="140" y2="220" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: Data product contracts -->
  <rect x="25" y="220" width="230" height="80" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Data product contracts</text>
  <rect x="52" y="250" width="176" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="264" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Schema contracts (JSON)</text>
  <rect x="48" y="274" width="184" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="288" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">SLAs / freshness / quality</text>
  <line x1="140" y1="300" x2="140" y2="325" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: Domain lakehouses -->
  <rect x="25" y="325" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Domain lakehouses</text>
  <rect x="79" y="355" width="122" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="369" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Cards (Iceberg)</text>
  <rect x="79" y="379" width="122" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="393" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Retail (Iceberg)</text>
  <rect x="75" y="403" width="130" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="417" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Wealth (Iceberg)</text>
  <line x1="140" y1="430" x2="140" y2="455" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: Per-domain pipelines -->
  <rect x="25" y="455" width="230" height="80" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="475" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Per-domain pipelines</text>
  <rect x="72" y="485" width="136" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="499" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Domain-owned ETL</text>
  <rect x="79" y="509" width="122" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="523" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Schema registry</text>
  <line x1="140" y1="535" x2="140" y2="560" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 5: Platform team -->
  <rect x="25" y="560" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="580" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Platform team</text>
  <rect x="72" y="590" width="136" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="604" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Catalog / discovery</text>
  <rect x="60" y="614" width="160" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="628" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Federated governance</text>
  <rect x="87" y="638" width="106" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="652" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Observability</text>
  <line x1="140" y1="665" x2="140" y2="690" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 6: Domain sources -->
  <rect x="25" y="690" width="230" height="125" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="710" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Domain sources</text>
  <rect x="85" y="720" width="110" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="734" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Cards systems</text>
  <rect x="85" y="744" width="110" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="758" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Retail systems</text>
  <rect x="82" y="768" width="116" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="782" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Wealth systems</text>
  <rect x="90" y="792" width="100" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="806" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Risk systems</text>
</svg>
