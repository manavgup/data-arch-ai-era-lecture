<svg width="100%" viewBox="0 0 280 870" xmlns="http://www.w3.org/2000/svg">
  <title>Data Warehouse architecture pattern</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer column (deep blue for warehouse) -->
  <rect x="10" y="20" width="260" height="830" rx="12" fill="rgb(12,68,124)" stroke="rgb(133,183,235)" stroke-width="0.5"/>
  <text x="140" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="rgb(250,249,245)">Data Warehouse</text>
  <text x="140" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(194,192,182)">Structured, schema on write</text>

  <!-- Layer 1: Consumption -->
  <rect x="25" y="90" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Consumption</text>
  <rect x="98" y="120" width="84" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Cognos BI</text>
  <rect x="105" y="144" width="70" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Reports</text>
  <rect x="72" y="168" width="136" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="182" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Planning Analytics</text>
  <line x1="140" y1="195" x2="140" y2="220" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: Storage -->
  <rect x="25" y="220" width="230" height="130" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Storage</text>
  <rect x="83" y="250" width="114" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="264" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Db2 Warehouse</text>
  <rect x="58" y="274" width="164" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="288" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Db2 for z/OS / Netezza</text>
  <rect x="52" y="298" width="176" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Conformed star schemas</text>
  <rect x="55" y="322" width="170" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="336" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Star &amp; snowflake models</text>
  <line x1="140" y1="350" x2="140" y2="375" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: ETL -->
  <rect x="25" y="375" width="230" height="80" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="395" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">ETL</text>
  <rect x="95" y="405" width="90" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="419" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">DataStage</text>
  <rect x="75" y="429" width="130" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="443" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Data Replication</text>
  <line x1="140" y1="455" x2="140" y2="480" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: Governance -->
  <rect x="25" y="480" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="500" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Governance</text>
  <rect x="68" y="510" width="144" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="524" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Knowledge Catalog</text>
  <rect x="82" y="534" width="116" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="548" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Data Quality</text>
  <rect x="80" y="558" width="120" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="572" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">MDM Match 360</text>
  <line x1="140" y1="585" x2="140" y2="610" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 5: Sources -->
  <rect x="25" y="610" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="630" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Sources</text>
  <rect x="67" y="640" width="146" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="654" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Core banking / ERP</text>
  <rect x="55" y="664" width="170" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="678" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Mainframe / Db2 z/OS</text>
  <rect x="82" y="688" width="116" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="702" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Structured only</text>
</svg>
