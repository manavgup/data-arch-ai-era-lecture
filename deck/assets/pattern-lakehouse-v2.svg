<svg width="100%" viewBox="0 0 280 1080" xmlns="http://www.w3.org/2000/svg">
  <title>Data Lakehouse architecture pattern</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer column (violet for lakehouse) -->
  <rect x="10" y="20" width="260" height="1040" rx="12" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
  <text x="140" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="rgb(250,249,245)">Data Lakehouse</text>
  <text x="140" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(194,192,182)">One copy, all workloads</text>

  <!-- Layer 1: Consumption -->
  <rect x="25" y="90" width="230" height="150" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Consumption</text>
  <rect x="98" y="120" width="84" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Cognos BI</text>
  <rect x="94" y="144" width="92" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">watsonx.ai</text>
  <rect x="90" y="168" width="100" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="182" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Watson Studio</text>
  <rect x="87" y="192" width="106" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Agents / RAG</text>
  <rect x="55" y="216" width="170" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">BI + DS + ML + gen AI</text>
  <line x1="140" y1="240" x2="140" y2="265" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: Query engines -->
  <rect x="25" y="265" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Query engines</text>
  <rect x="105" y="295" width="70" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="309" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Presto</text>
  <rect x="108" y="319" width="64" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="333" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Spark</text>
  <rect x="93" y="343" width="94" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="357" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Db2 engine</text>
  <line x1="140" y1="370" x2="140" y2="395" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: Open table formats -->
  <rect x="25" y="395" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Open table formats</text>
  <rect x="79" y="425" width="122" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="439" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Apache Iceberg</text>
  <rect x="95" y="449" width="90" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="463" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Delta Lake</text>
  <rect x="85" y="473" width="110" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="487" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Milvus vector</text>
  <line x1="140" y1="500" x2="140" y2="525" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: Object storage -->
  <rect x="25" y="525" width="230" height="80" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="545" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Object storage</text>
  <rect x="79" y="555" width="122" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="569" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">S3 / COS / MinIO</text>
  <rect x="72" y="579" width="136" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="593" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Parquet underneath</text>
  <line x1="140" y1="605" x2="140" y2="630" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 5: ETL + streaming -->
  <rect x="25" y="630" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="650" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">ETL + streaming</text>
  <rect x="75" y="660" width="130" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="674" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">DataStage / CDC</text>
  <rect x="75" y="684" width="130" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="698" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Kafka / real-time</text>
  <rect x="75" y="708" width="130" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="722" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Data Replication</text>
  <line x1="140" y1="735" x2="140" y2="760" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 6: Sources -->
  <rect x="25" y="760" width="230" height="55" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="780" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Sources</text>
  <rect x="40" y="790" width="200" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="804" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Structured + unstructured + streaming</text>
</svg>
