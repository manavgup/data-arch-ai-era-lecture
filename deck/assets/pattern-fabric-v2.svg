<svg width="100%" viewBox="0 0 280 930" xmlns="http://www.w3.org/2000/svg">
  <title>Data Fabric architecture pattern</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer column (ochre/brown for fabric) -->
  <rect x="10" y="20" width="260" height="890" rx="12" fill="rgb(120,60,0)" stroke="rgb(220,170,100)" stroke-width="0.5"/>
  <text x="140" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="rgb(250,249,245)">Data Fabric</text>
  <text x="140" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(194,192,182)">AI-driven governance layer</text>

  <!-- Layer 1: Self-serve discovery -->
  <rect x="25" y="90" width="230" height="80" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Self-serve discovery</text>
  <rect x="68" y="120" width="144" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Knowledge Catalog</text>
  <rect x="44" y="144" width="192" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Automated recommendations</text>
  <line x1="140" y1="170" x2="140" y2="195" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: AI metadata layer -->
  <rect x="25" y="195" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">AI metadata layer</text>
  <rect x="82" y="225" width="116" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="239" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">AI classification</text>
  <rect x="72" y="249" width="136" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="263" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Automated lineage</text>
  <rect x="72" y="273" width="136" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="287" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Quality monitoring</text>
  <line x1="140" y1="300" x2="140" y2="325" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: Underlying patterns -->
  <rect x="25" y="325" width="230" height="125" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Underlying patterns</text>
  <rect x="95" y="355" width="90" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="369" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Warehouse</text>
  <rect x="95" y="379" width="90" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="393" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Lakehouse</text>
  <rect x="112" y="403" width="56" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="417" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Lake</text>
  <rect x="82" y="427" width="116" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="441" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">External stores</text>
  <line x1="140" y1="450" x2="140" y2="475" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: Policy-aware routing -->
  <rect x="25" y="475" width="230" height="80" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="495" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Policy-aware routing</text>
  <rect x="55" y="505" width="170" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="519" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Schema drift detection</text>
  <rect x="44" y="529" width="192" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="543" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Governance-first ingestion</text>
  <line x1="140" y1="555" x2="140" y2="580" stroke="rgb(156,154,146)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 5: Heterogeneous sources -->
  <rect x="25" y="580" width="230" height="105" rx="8" fill="white" stroke="rgb(200,200,200)" stroke-width="0.5"/>
  <text x="140" y="600" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgb(21,23,26)">Heterogeneous sources</text>
  <rect x="48" y="610" width="184" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="624" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Db2 / Oracle / Iceberg</text>
  <rect x="44" y="634" width="192" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="648" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">PDFs / APIs / third-party</text>
  <rect x="72" y="658" width="136" height="20" rx="4" fill="rgb(208,226,255)" stroke="rgb(141,180,240)" stroke-width="0.5"/>
  <text x="140" y="672" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="rgb(0,43,128)">Cloud + on-prem</text>
</svg>
